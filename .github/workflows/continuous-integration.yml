# https://docs.github.com/en/actions

name: "CI Tests"

on:
    pull_request: ~
    push:
        branches:
            - "main"
        tags:
            - "v*"
    workflow_dispatch: ~

permissions:
    contents: "read"

env:
    # Releases (v* tags) must be on this branch, see job "release".
    RELEASE_BRANCH: "main"

jobs:
    phpunit:
        name: "PHPUnit tests (PHP ${{ matrix.php-version }})"

        runs-on: "ubuntu-latest"

        strategy:
            fail-fast: false
            matrix:
                php-version:
                    # nightly build of the PHP-8.6 branch until 8.6.0 is released
                    - "8.6"

        steps:
            - name: "Checkout"
              uses: "actions/checkout@v5"

            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  php-version: "${{ matrix.php-version }}"
                  extensions: "dom, simplexml, mbstring"
                  coverage: "none"
                  tools: "composer"

            - name: "Install dependencies"
              run: "composer update --no-interaction --no-progress --prefer-dist"

            - name: "Tests"
              run: "vendor/bin/phpunit"

            - name: "Smoke test command line tool"
              run: "php bin/ddate '%{%A, %B %d,%} %Y YOLD' 29022012"

    phar:
        name: "Build PHAR"

        runs-on: "ubuntu-latest"

        steps:
            - name: "Checkout"
              uses: "actions/checkout@v5"

            # Box is pinned to a version and checksum.
            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  php-version: "8.6"
                  coverage: "none"
                  tools: "composer, box:4.7.0@sha256:3d390eeaec33288098fe83f8a54c60cc575cb6be295f38ff4482b4b4f26f8d52"

            - name: "Install dependencies without dev dependencies"
              run: "composer update --no-dev --no-interaction --no-progress --prefer-dist"

            - name: "Compile PHAR"
              run: "box compile --no-interaction"

            - name: "Upload PHAR"
              uses: "actions/upload-artifact@v7"
              with:
                  name: "ddate-phar"
                  path: "build/phar/ddate.phar"
                  if-no-files-found: "error"

    phar-test:
        name: "PHAR smoke test (PHP ${{ matrix.php-version }})"

        needs: "phar"

        runs-on: "ubuntu-latest"

        strategy:
            fail-fast: false
            matrix:
                php-version:
                    # nightly build of the PHP-8.6 branch until 8.6.0 is released
                    - "8.6"

        steps:
            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  php-version: "${{ matrix.php-version }}"
                  extensions: "dom"
                  coverage: "none"
                  ini-values: "error_reporting=-1, display_errors=On"

            - name: "Download PHAR"
              uses: "actions/download-artifact@v8"
              with:
                  name: "ddate-phar"

            - name: "Run PHAR"
              run: |
                  output="$(php ddate.phar '%{%A, %B %d,%} %Y YOLD' 29022012)"
                  echo "$output"
                  test "$output" = "St. Tib's Day 3178 YOLD"
                  output="$(php ddate.phar '%A, %e %B %Y' 25102026 de)"
                  echo "$output"
                  test "$output" = "Stichtag, 6. Grummet 3192"

    release:
        name: "Publish PHAR on GitHub release"

        if: "startsWith(github.ref, 'refs/tags/v')"

        needs:
            - "phpunit"
            - "phar-test"

        runs-on: "ubuntu-latest"

        permissions:
            contents: "write"
            id-token: "write"
            attestations: "write"

        steps:
            - name: "Checkout"
              uses: "actions/checkout@v5"
              with:
                  fetch-depth: 0

            # Stops releases from a tag on the wrong branch before anything
            # is published (Packagist publishes the tag regardless).
            - name: "Check that the tag is on ${{ env.RELEASE_BRANCH }}"
              run: |
                  git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH" || { echo "::error::Tag $GITHUB_REF_NAME is not on $RELEASE_BRANCH"; exit 1; }

            - name: "Download PHAR"
              uses: "actions/download-artifact@v8"
              with:
                  name: "ddate-phar"

            # Signed build provenance (Sigstore), verifiable with
            # "gh attestation verify ddate.phar --repo dweichert/Ddate".
            - name: "Attest build provenance"
              uses: "actions/attest-build-provenance@v4"
              with:
                  subject-path: "ddate.phar"

            # Creates the release for the pushed tag, or adds the PHAR to a
            # release that was already created for it.
            - name: "Upload PHAR to release"
              env:
                  GH_TOKEN: "${{ github.token }}"
                  TAG: "${{ github.ref_name }}"
              run: |
                  if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      gh release upload "$TAG" ddate.phar --clobber --repo "$GITHUB_REPOSITORY"
                  else
                      gh release create "$TAG" ddate.phar --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_BRANCH" --title "$TAG" --generate-notes
                  fi
